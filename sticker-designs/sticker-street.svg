<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">

  <!-- Background black -->
  <rect width="600" height="200" rx="14" fill="#0D0D0D"/>

  <!-- Orange border accent -->
