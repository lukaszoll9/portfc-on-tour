<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0B1A2E">
  <title>Admin · Port FC on Tour</title>
  <link rel="icon" type="image/png" href="/favicon-48.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/assets/css/site.css">
  <style>
    .adm-head{display:flex;align-items:center;justify-content:space-between;gap:12px;height:58px}
    .adm-title{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:24px;line-height:1}
    .login{max-width:380px;margin:12vh auto 0;display:grid;gap:12px;padding:24px;border-radius:var(--r-m);background:var(--deck);border:1px solid var(--line)}
    .login img{width:60px;justify-self:center}
    .filters{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 12px}
    .filters button{border:1px solid var(--line);background:var(--deck);color:var(--muted);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600}
    .filters button[aria-pressed="true"]{background:var(--orange);color:#1A0D02;border-color:var(--orange)}
    .list{display:grid;gap:8px;padding-bottom:40px}
    .item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--deck);color:var(--text);width:100%}
    .item img,.item .ph{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--hull)}
    .item .c{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .item .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .item.is-hidden{opacity:.55}
    .badge{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
    .badge.warn{border-color:var(--warn);color:var(--warn)}
    .badge.off{border-color:var(--err);color:var(--err)}
    .edit-photo{width:100%;max-height:220px;object-fit:cover;border-radius:12px}
    .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--deck);border:1px solid var(--line)}
    .toggle input{width:22px;height:22px;accent-color:var(--orange)}
    .coords{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
    .actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;position:sticky;bottom:0;background:var(--night);padding-top:10px}
  </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
  <symbol id="i-pin" viewBox="0 0 40 52"><path d="M20 51C20 51 37 30.5 37 18.5 37 8.8 29.4 1.5 20 1.5S3 8.8 3 18.5C3 30.5 20 51 20 51z" fill="#EE7D2B" stroke="#0B1A2E" stroke-width="2.5"/><circle cx="20" cy="18.5" r="6.5" fill="#0B1A2E"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.5"/></symbol>
</svg>

<header class="topbar"><div class="wrap adm-head">
  <a class="brand" href="/"><img src="/assets/lion.webp" alt="" width="34" height="37"><span class="adm-title">Admin</span></a>
  <button type="button" class="link-btn" id="logout" hidden>Abmelden</button>
</div></header>

<main class="wrap">
  <form class="login" id="loginForm">
    <img src="/assets/lion.webp" alt="">
    <label class="field"><span style="font-weight:600">Admin-Passwort</span><input class="inp" type="password" id="pw" autocomplete="current-password" required></label>
    <button class="btn btn-primary" type="submit">Anmelden</button>
    <div class="note err" id="loginErr" hidden></div>
  </form>

  <section id="panel" hidden>
    <div class="filters" role="group">
      <button type="button" data-f="all" aria-pressed="true">Alle</button>
      <button type="button" data-f="nopin" aria-pressed="false">Ohne Pin</button>
      <button type="button" data-f="hidden" aria-pressed="false">Ausgeblendet</button>
    </div>
    <div class="list" id="list"></div>
  </section>
</main>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="editSheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-grab"></div>
  <div class="sheet-head">
    <div class="sheet-title">Spot bearbeiten</div>
    <button type="button" class="icon-btn" id="editClose" aria-label="Schließen"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="sheet-body">
    <div class="step">
      <img class="edit-photo" id="ePhoto" alt="">
      <div class="search">
        <svg><use href="#i-search"/></svg>
        <input class="inp" id="eSearch" type="search" placeholder="Ort suchen…" autocomplete="off">
        <div class="results" id="eResults" hidden></div>
      </div>
      <div class="picker">
        <div id="pickMap"></div>
        <div class="pin-shadow"></div>
        <div class="pin"><svg><use href="#i-pin"/></svg></div>
        <div class="pin-label" id="ePinLabel" hidden></div>
      </div>
      <div class="coords" id="eCoords"></div>
      <div class="field"><label for="eCity">Ort (so wird er angezeigt)</label>
        <div class="row-2" style="grid-template-columns:1fr auto"><input class="inp" id="eCity"><button type="button" class="btn btn-quiet locate-btn" id="eUseDetected">Vom Pin</button></div>
      </div>
      <div class="field"><label for="eName">Name</label><input class="inp" id="eName"></div>
      <div class="field"><label for="eIg">Instagram</label><input class="inp" id="eIg" autocapitalize="off"></div>
      <label class="toggle"><span><b>Ausblenden</b><br><span class="fine">Spot verschwindet von der Seite, bleibt in Airtable.</span></span><input type="checkbox" id="eHidden"></label>
      <div class="note err" id="eErr" hidden></div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" id="eCancel">Abbrechen</button>
        <button type="button" class="btn btn-primary" id="eSave">Speichern</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="/assets/js/geo.js"></script>
<script src="/assets/js/admin.js"></script>
</body>
</html>
